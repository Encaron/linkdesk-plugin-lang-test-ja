<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- lang-test-ja 身份图「日本語测试语言包」：朱红块 + 两枚对开语言卡 + 前卡一枚日之丸
       意象 = 语言包的家族意象（同 lang-defaults 的两枚对开卡）＋ 日之丸 = 日语
       （刻意不做「あ」字样：SVG 里写字会绑字体，跨机字形漂移）
       家族：40×40 圆角方载体 + 135° 双档渐变 + 白玻璃罩 + 发丝光边（Type-2 彩色身份图） -->
  <defs>
    <linearGradient id="jaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="jaSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#jaBg)"/>
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#jaSheen)"/>
  <rect x="4.5" y="4.5" width="39" height="39" rx="9.5" fill="none" stroke="#FFE4E6" stroke-opacity="0.32"/>

  <!-- 后语言卡（左下错位露出，粉白） -->
  <rect x="10.5" y="19.5" width="17" height="17" rx="3.5" fill="#FFE4E6" opacity="0.95"/>

  <!-- 前语言卡（右前叠压，白纸） -->
  <rect x="19.5" y="12" width="18" height="18" rx="3.5" fill="#FFF7F7"/>
  <rect x="19.5" y="12" width="18" height="18" rx="3.5" fill="none" stroke="#881337" stroke-opacity="0.16"/>

  <!-- 日之丸（前卡上的日语标识） -->
  <circle cx="28.5" cy="19.4" r="4.9" fill="#E11D48"/>

  <!-- 前卡底部文案行（呼应 lang-defaults 的「被翻译的文案」） -->
  <rect x="22.6" y="26.2" width="9" height="1.8" rx="0.9" fill="#FB7185" opacity="0.85"/>
</svg>
